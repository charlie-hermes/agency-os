name: verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-repository-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: fleet-portal/package-lock.json
      - run: python -m pip install --requirement requirements-test.txt
      - run: npm ci --prefix fleet-portal --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        working-directory: fleet-portal
      - run: ./scripts/verify
      - run: npm --prefix fleet-portal run test:browser
